# 业务大事件日历种子数据（技术规格 §5.10、需求说明书 §5.7）
#
# 作用：把"外部发生了什么"从人脑记忆变成可匹配的数据。异动归因里最危险的一类误判，
# 就是把外部冲击（竞品降价、平台发券、原料调价）当成内部执行问题；有日历才能把它们
# 作为**外生变量**写进因果链。
#
# 字段：
#   name/type    事件名称与类型（竞品动作 / 平台政策 / 成本冲击 / 内部动作 / 外部环境）
#   window       起止日期（闭区间）
#   dimensions   事件影响的维度编码（与指标字典的 dimensions 对齐）
#   note         备注，报告里会原样引用
